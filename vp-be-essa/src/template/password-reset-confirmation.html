<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Confirmation</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center;">
  <div
    style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; padding-bottom: 10px;">

    <!-- Header -->
    <div style="text-align: center; padding-top: 30px;">
      <img src="https://res.cloudinary.com/dvdgpxne8/image/upload/v1747829491/uploads/uploads/logo3-1747829489894.png.png"
        alt="Daikin Logo" style="width: 200px; height: 43.04px;" />
    </div>

    <!-- Content -->
    <div
      style="text-align: center; font-size: 18px; color: #333; background-color: #fff; padding: 20px 40px 10px 40px; border-radius: 8px;">
      <span style="font-size: 18px; font-weight: 400; color: #1f6ea9;">Dear <strong>{{vendorName}}</strong></span>
      <div style="border-bottom: 1px solid #1f6ea9; width: 50px; margin: 10px auto 0 auto;"></div>
      <p style="font-size: 20px; font-weight: 600; color: #585858; margin-top: 20px; margin-bottom: 10px;">
        Your Password Has been Updated Successfully
      </p>
    </div>

    <!-- Footer -->
    <div class="footer" style="margin-top: 0; padding-top: 5px;">
      <div style="font-size: 14px; color: #000000; text-align: center; margin-top: 10px;">
        Copyright © Daikin. All Rights Reserved |
        <a href="https://www.daikinmea.com" style="color: #000000;">www.daikinmea.com</a>
      </div>

      <div style="text-align: center; margin-top: 10px; margin-bottom: 15px;">
        <a href="{{facebook}}" target="_blank" rel="noopener noreferrer" style="margin: 0 5px; display: inline-block;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="20" height="20"
            style="border: none;" />
        </a>
        <a href="{{twitter}}" target="_blank" rel="noopener noreferrer" style="margin: 0 5px; display: inline-block;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" width="20" height="20"
            style="border: none;" />
        </a>
        <a href="{{linkedIn}}" target="_blank" rel="noopener noreferrer" style="margin: 0 5px; display: inline-block;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733561.png" alt="LinkedIn" width="20" height="20"
            style="border: none;" />
        </a>
        <a href="{{youtube}}" target="_blank" rel="noopener noreferrer" style="margin: 0 5px; display: inline-block;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733646.png" alt="YouTube" width="20" height="20"
            style="border: none;" />
        </a>
        <a href="{{instagram}}" target="_blank" rel="noopener noreferrer" style="margin: 0 5px; display: inline-block;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram" width="20" height="20"
            style="border: none;" />
        </a>
      </div>
    </div>

  </div>
</body>

</html>
