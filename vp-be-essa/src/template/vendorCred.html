<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vendor Registration</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f4; padding: 20px 0;">
        <tr>
            <td align="center">
                <table cellpadding="0" cellspacing="0" border="0" width="600"
                    style="background-color: #ffffff; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5)">
                    <tr>
                        <td align="center" style="padding: 30px;">
                            <img src="https://res.cloudinary.com/dvdgpxne8/image/upload/v1747829491/uploads/uploads/logo3-1747829489894.png.png"
                                alt="Daikin Logo" width="200" height="43.04" />
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px;">
                            <p style="font-size: 18px; color: #1F6EA9; margin: 0;">Dear <strong>{{vendorName}}</strong></p>
                            <div style="border-bottom: 1px solid #1F6EA9; width: 50px; margin: 10px auto;"></div>
                            <p style="font-size: 42px; font-weight: 400; color: #1D71AC; margin: 15px 0;">
                                Congratulations!</p>
                            <p style="font-size: 20px; font-weight: 600; color: #585858; margin: 0;">Your application
                                has been Approved successfully.</p>
                            <p style="font-size: 16px; font-weight: 500; color: #585858; margin: 20px 0 10px 0;">
                                Please find your credentials below:</p>

                            <!-- Inline labels so value starts right after the colon -->
                    
                            <table style="font-size:15px; color:#555; margin:0; border-collapse:collapse;">
                                <tr>
                                    <td><strong>Email:</strong> <span style="color:#585858;">{{email}}</span></td>
                                </tr>
                                <tr>
                                    <td><strong>Password:</strong> <span style="color:#585858;">{{password}}</span></td>
                                </tr>
                            </table>

                            <p style="font-size: 16px; font-weight: 600; color: #585858; margin: 20px 0 10px 0;">
                                Please click below to get started</p>
                            <a href="{{registrationLink}}"
                                style="display: inline-block; background-color: #149CE0; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; width: 200px;">Start</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #1F6EA9; color: white; padding: 20px;">
                            <table cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left" style="font-size: 12px; vertical-align: middle">
                                        Copyright © Daikin.  All Rights Reserved
                                    </td>
                                    <td align="right">
                                        <a href="https://www.daikinmea.com" target="_blank"
                                            style="color: white; font-size: 12px; text-decoration: none;">www.daikinmea.com
                                            |</a>
                                        <a href="https://www.facebook.com/daikinmeagroup/" target="_blank"><img
                                                src="https://cdn-icons-png.flaticon.com/512/733/733547.png"
                                                alt="Facebook" width="20" height="20"
                                                style="margin-left: 5px; vertical-align: middle" /></a>
                                        <a href="https://x.com/daikin_mea" target="_blank"><img
                                                src="https://cdn-icons-png.flaticon.com/512/733/733579.png"
                                                alt="Twitter" width="20" height="20"
                                                style="margin-left: 5px; vertical-align: middle" /></a>
                                        <a href="https://www.linkedin.com/company/daikin-middle-east-africa/" target="_blank"><img
                                                src="https://cdn-icons-png.flaticon.com/512/733/733561.png"
                                                alt="LinkedIn" width="20" height="20"
                                                style="margin-left: 5px; vertical-align: middle" /></a>
                                        <a href="https://www.youtube.com/channel/UC46JAqOlymW5jBo6B2ImQGg" target="_blank"><img
                                                src="https://cdn-icons-png.flaticon.com/512/733/733646.png"
                                                alt="YouTube" width="20" height="20"
                                                style="margin-left: 5px; vertical-align: middle" /></a>
                                        <a href="https://www.instagram.com/accounts/login/?next=%2Fdaikinmea%2F&source=omni_redirect" target="_blank"><img
                                                src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram"
                                                width="20" height="20"
                                                style="margin-left: 5px; vertical-align: middle" /></a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
