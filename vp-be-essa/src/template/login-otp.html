<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor OTP</title>
</head>

<body style="margin: 0; padding: 0; background-color: #e0e0e0; font-family: Arial, sans-serif; text-align: center;">
    <!-- Outer wrapper table for background -->
    <table width="100%" border="0" cellspacing="0" cellpadding="0" align="center" style="background-color: #e0e0e0;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <!-- Inner container with simulated shadow (white box over grey background) -->
                <table width="500" border="0" cellspacing="0" cellpadding="0" align="center"
                    style="background-color: #ffffff; padding: 30px;">
                    <tr>
                        <td align="center" style="padding-bottom: 20px;">
                            <img src="https://res.cloudinary.com/dvdgpxne8/image/upload/v1747829491/uploads/uploads/logo3-1747829489894.png.png"
                                alt="Daikin Logo" style="width: 200px; height: auto; display: block;" />
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="font-size: 18px; font-weight: 400; color: #1f6ea9;">
                            Dear <strong>{{vendorName}}</strong>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top: 10px; padding-bottom: 10px;">
                            <hr style="border: none; border-bottom: 1px solid #1f6ea9; width: 50px;" />
                        </td>
                    </tr>
                    <tr>
                        <td align="center"
                            style="font-size: 20px; font-weight: 600; color: #585858; padding-top: 20px; padding-bottom: 10px;">
                            Your One-Time Password (OTP) is:
                        </td>
                    </tr>
                    <tr>
                        <td align="center"
                            style="font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #333333; padding: 20px 0;">
                            {{otp}}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px 0; background-color: #ffffff;">
                            <p style="font-size: 14px; color: #000000; margin: 0;">
                                Copyright © Daikin. All Rights Reserved |
                                <a href="https://www.daikinmea.com" style="color: #000000; text-decoration: none;">www.daikinmea.com</a>
                            </p>
                    
                            <table align="center" cellpadding="0" cellspacing="0" border="0" style="margin-top: 10px;">
                                <tr>
                                    <td style="padding: 0 5px;">
                                        <a href="{{facebook}}"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"
                                            alt="Facebook" width="20" height="20" style="display: block;" /></a>
                                    </td>
                                    <td style="padding: 0 5px;">
                                        <a href="{{twitter}}"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" 
                                            alt="Twitter" width="20" height="20" style="display: block;" /></a>
                                    </td>
                                    <td style="padding: 0 5px;">
                                        <a href="{{linkedIn}}"><img src="https://cdn-icons-png.flaticon.com/512/733/733561.png"
                                            alt="LinkedIn" width="20" height="20" style="display: block;" /></a>
                                    </td>
                                    <td style="padding: 0 5px;">
                                        <a href="{{youtube}}"><img src="https://cdn-icons-png.flaticon.com/512/733/733646.png" 
                                            alt="YouTube" width="20" height="20" style="display: block;" /></a>
                                    </td>
                                    <td style="padding: 0 5px;">
                                        <a href="{{instagram}}"><img src="https://cdn-icons-png.flaticon.com/512/733/733558.png"
                                            alt="Instagram" width="20" height="20" style="display: block;" /></a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
